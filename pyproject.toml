[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "starling-bench"
version = "0.1.0"
description = "Reproducible, quality-gated experiments for native speech inference"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
starling-bench = "starling_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/starling_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
