name: checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run starling-bench schemas --out schemas
      - run: git diff --exit-code -- schemas
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  harbor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --project integrations/harbor --locked
      - run: uv run --project integrations/harbor pytest tests/test_harbor.py
